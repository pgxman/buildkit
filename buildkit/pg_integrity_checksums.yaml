apiVersion: v1
name: pg_integrity_checksums
version: "2.1.0"
homepage: https://github.com/VictorNagibator/pg_integrity_checksums
repository: https://github.com/VictorNagibator/pg_integrity_checksums
source: https://github.com/VictorNagibator/pg_integrity_checksums/archive/refs/tags/v2.1.0.tar.gz
description: Online integrity checks for PostgreSQL at page, tuple, table, index and database level.
license: MIT
keywords:
  - checksum
  - data-integrity
  - corruption-detection
  - verification
arch:
  - amd64
  - arm64
maintainers:
  - name: Viktor
    email: vityadonskoy2004@gmail.com
build:
  main:
    - name: Build pg_integrity_checksums
      run: |
        make
        DESTDIR=${DESTDIR} make install
pgVersions:
  - "12"
  - "13"
  - "14"
  - "15"
  - "16"
  - "17"
  - "18"
  - "19"
